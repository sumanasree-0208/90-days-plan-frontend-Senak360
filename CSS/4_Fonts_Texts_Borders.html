<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- this is font using google fonts embedded chosen code... -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <style>
        p {
            font-size: 30px;
            /* font-style: sans-serif; */
            /* font-family: 'Times New Roman', Times, serif; */
            font-family: "Dancing Script", cursive;
            font-weight: 400;
            font-weight: lighter;
            font-weight: normal;
            /* text-decoration: underline; */
            /* text-transform: capitalize; */
            text-overflow: inherit;
            text-indent: 10px;
            line-height: 1.5;
            letter-spacing: 1.8px;
            word-spacing: 5px;
            text-align: center;
            /* background-color: aqua; */
            color: chartreuse;
            background-size: cover;
            /* background-image: url(./background-image.jpg); */
            /* background-image: linear-gradient(to right, #e77373, #a85ff0); */
            background-repeat: no-repeat;
            background-attachment: fixed;
            /*only text moves while scrolling not image... if scroll is selected then image will scroll*/
            /* background-image: linear-gradient(to right, #ff9999, #99ccff),
                radial-gradient(circle closest-side at center, #6699cc, #ffcc66); */
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            margin: 20px;
            border-radius: 10px;
            padding: 30px;
            font-weight: bold;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px, rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px, rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
            text-shadow: 2px 2px 2px #CE3015;
            /* text-align:; */
        }
    </style>
</head>

<body>
    <p>Using these shorthand properties can help you write CSS more efficiently and maintain consistent styling
        across your web pages. Feel free to apply these concepts in your projects and experiment with different
        values to see the visual impact on your web elements.
    </p>
</body>

</html>
