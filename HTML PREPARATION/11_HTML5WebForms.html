<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-
        9]{3}-[0-9]{4}" placeholder="123-456-7890"><br><br>
        <label for="firstNameId">First Name</label>
        <input type="text" autocomplete="off" required name="firstname" id="firstNameId"
            placeholder="Enter first name" />
        <input type="url" required placeholder="enter url" name="" id="" />
        <input type="email" placeholder="enter email" name="" id="" />
        <input type="number" placeholder="enter age" name="" id="" />
        <input type="datetime-local" placeholder="Select data time" name="" id="" />
        <select hidden name="" id="">
            <optgroup>
                <option value="java">jfsd</option>
                <option value="dotnet">dfsd</option>
                <option value="python">pfsd</option>
                <option value="AP">Andhra Pradesh</option>
            </optgroup>
        </select>


        <input list="courses" placeholder="Select courses" name="" id="" />
        <datalist id="courses">
            <option value="java">jfsd</option>
            <option value="dotnet">dfsd</option>
            <option value="python">pfsd</option>
            <option value="AP">Andhra Pradesh</option>
        </datalist>

        <p contenteditable="true">content editable here </p>
        <button>Submit</button>

        <label for="quantity">Quantity (1-10):</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10"
            placeholder="Enter a number between 1 and 10"><br>
        <label for="website">Website URL:</label>
        <input type="url" id="website" name="website" placeholder="https://www.example.com"><br><br>
        <label for="search">Search:</label>
        <input type="search" id="search" name="search" placeholder="Search
        here"><br><br>
        <label for="file">Upload File:</label>
        <input type="file" id="file" name="file"><br><br>
        <label for="range">Range (1-100):</label>
        <input type="range" id="range" name="range" min="1" max="100"><br><br>
        <input type="submit" value="Submit">
    </form>
</body>

</html>
